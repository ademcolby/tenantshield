<svg width="1200" height="630" viewBox="0 0 1200 630" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>TenantShield — Get your security deposit back</title>
  <desc>Social share card for TenantShield showing brand, tagline, and value proposition</desc>

  <rect width="1200" height="630" fill="#FAFAF7"/>
  <rect x="0" y="0" width="8" height="630" fill="#B45309"/>
  <rect x="60" y="60" width="1080" height="510" rx="16" fill="#F3F1EC" stroke="#E7E5E0" stroke-width="1"/>

  <g transform="translate(120, 140)">
    <path d="M0 0L32 12v20c0 14-10.8 26.4-32 30C-21.2 58.4-32 46-32 32V12L0 0z" fill="#B45309" transform="translate(32,0)"/>
    <text x="32" y="26" text-anchor="middle" fill="white" font-size="18" font-weight="700" font-family="Georgia, serif">TS</text>
    <text x="72" y="28" font-family="Georgia, serif" font-size="36" font-weight="700" fill="#0F172A" letter-spacing="-1">TenantShield</text>
  </g>

  <line x1="120" y1="210" x2="480" y2="210" stroke="#E7E5E0" stroke-width="1"/>

  <text x="120" y="290" font-family="Georgia, serif" font-size="58" font-weight="700" fill="#0F172A" letter-spacing="-2">Get your security</text>
  <text x="120" y="360" font-family="Georgia, serif" font-size="58" font-weight="700" fill="#0F172A" letter-spacing="-2">deposit back.</text>

  <text x="120" y="430" font-family="Arial, sans-serif" font-size="26" fill="#475569" letter-spacing="-0.5">State-specific demand letters with real statute citations.</text>
  <text x="120" y="468" font-family="Arial, sans-serif" font-size="26" fill="#475569" letter-spacing="-0.5">All 50 states. $39 flat fee.</text>

  <rect x="120" y="500" width="260" height="56" rx="28" fill="#B45309"/>
  <text x="250" y="534" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="white">Generate your letter →</text>

  <g transform="translate(780, 140)">
    <rect width="300" height="320" rx="12" fill="white" stroke="#E7E5E0" stroke-width="1"/>
    <rect x="0" y="0" width="300" height="48" rx="12" fill="#0F172A"/>
    <rect x="0" y="24" width="300" height="24" fill="#0F172A"/>
    <text x="20" y="30" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="white" letter-spacing="1">DEMAND LETTER</text>

    <text x="20" y="80" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">Date</text>
    <text x="20" y="98" font-family="Arial, sans-serif" font-size="12" fill="#0F172A">May 27, 2026</text>

    <text x="20" y="128" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">Re: Security Deposit</text>
    <text x="20" y="146" font-family="Arial, sans-serif" font-size="12" fill="#0F172A">$2,400.00 — 123 Main St</text>

    <line x1="20" y1="164" x2="280" y2="164" stroke="#E7E5E0" stroke-width="0.5"/>

    <text x="20" y="188" font-family="Arial, sans-serif" font-size="10" fill="#475569">Pursuant to Florida Statutes § 83.49,</text>
    <text x="20" y="204" font-family="Arial, sans-serif" font-size="10" fill="#475569">you were required to return the deposit</text>
    <text x="20" y="220" font-family="Arial, sans-serif" font-size="10" fill="#475569">within 15 days of lease termination.</text>
    <text x="20" y="248" font-family="Arial, sans-serif" font-size="10" fill="#475569">Failure to comply forfeits your right</text>
    <text x="20" y="264" font-family="Arial, sans-serif" font-size="10" fill="#475569">to impose any claim on the deposit.</text>

    <line x1="20" y1="284" x2="280" y2="284" stroke="#E7E5E0" stroke-width="0.5"/>

    <rect x="20" y="296" width="140" height="12" rx="2" fill="#E7E5E0"/>
    <rect x="20" y="314" width="100" height="12" rx="2" fill="#E7E5E0"/>
  </g>

  <text x="1140" y="590" text-anchor="end" font-family="Arial, sans-serif" font-size="18" fill="#94A3B8">gettenantshield.com</text>
</svg>
